<div class="container mt-5" *ngIf="movie">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow bg-dark text-white">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h3 class="mb-0">{{ movie.title }}</h3>
          <a routerLink="/movies" class="btn btn-light btn-sm fw-bold">Regresar al Catálogo</a>
        </div>
        <div class="card-body">
          <div class="row">
            <!-- Portada de la película -->
            <div class="col-md-4 mb-3 text-center">
              <img [src]="movie.cover" [alt]="movie.title" class="img-fluid rounded shadow" style="max-height: 300px; object-fit: cover;">
            </div>
            <!-- Datos detallados -->
            <div class="col-md-8">
              <p><strong>Director:</strong> {{ movie.director }}</p>
              <p><strong>Año:</strong> {{ movie.year || movie.release_year }}</p>
              <p><strong>Género:</strong> {{ movie.genre || 'No especificado' }}</p>
              <hr>
              <p><strong>Sinopsis:</strong></p>
              <p class="text-light">{{ movie.synopsis }}</p>
            </div>
          </div>

          <!-- Botones requeridos en la vista detallada (Punto 4): Editar, Eliminar y Regresar -->
          <div class="d-flex justify-content-between mt-4 pt-3 border-top border-secondary">
            <a routerLink="/movies" class="btn btn-secondary">
              Regresar al Catálogo
            </a>
            <div>
              <!-- Botón de Editar -->
              <a [routerLink]="['/movies/edit', movie.id]" class="btn btn-warning text-dark fw-bold me-2">
                Editar
              </a>
              <!-- Botón de Eliminar con la confirmación previa (Punto 6) -->
              <button class="btn btn-danger" (click)="deleteMovie(movie.id)">
                Eliminar
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Spinner mientras carga la información -->
<div class="text-center mt-5 text-white" *ngIf="!movie">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
  <p class="mt-2">Cargando detalles de la película...</p>
</div>
